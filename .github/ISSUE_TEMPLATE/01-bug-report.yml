name: "Bug report"
description: "Create a report to help us improve Terminal"
title: "[Bug]: "
labels: ["bug report"]
body:
  - type: markdown
    attributes:
      value: |
        **THIS IS THE BUG TRACKER OF THE TERMINAL FORK (ESTRIN217/Terminal). IT IS NOT AFFILIATED WITH THE TERMUX TEAM. DO NOT REPORT THESE ISSUES UPSTREAM.**

        Use search before you open an issue to check whether your issue has been already reported and perhaps solved.

        Only `arm64-v8a` devices are supported (bundled proot is AArch64-only).
  - type: textarea
    attributes:
      label: Problem description
      description: |
        A clear and concise description of what the problem is. You may attach the logs, screenshots, screen video recording and whatever else that will help to understand the issue.

        Issues without proper description will be closed without solution.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce the behavior.
      description: |
        Please post all necessary commands that are needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the expected behavior?
  - type: textarea
    attributes:
      label: System information
      description: Please provide info about your device
      value: |
        * Terminal application version:
        * Android OS version:
        * Device model:
    validations:
      required: true
