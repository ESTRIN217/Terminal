name: Trigger Terminal Library Builds on Jitpack

on:
  release:
    types:
      - published

jobs:
  trigger-terminal-library-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Set vars
        run: echo "TERMINAL_LIB_VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV # Do not include "v" prefix
      - name: Echo release
        run: echo "Triggering terminal library builds on jitpack for '$TERMINAL_LIB_VERSION' release after waiting for 3 mins"
      - name: Trigger terminal library builds on jitpack
        run: |
          sleep 180 # It will take some time for the new tag to be detected by Jitpack
          curl --max-time 600 --no-progress-meter "https://jitpack.io/com/github/ESTRIN217/Terminal/terminal-emulator/$TERMINAL_LIB_VERSION/terminal-emulator-$TERMINAL_LIB_VERSION.pom"
          curl --max-time 600 --no-progress-meter "https://jitpack.io/com/github/ESTRIN217/Terminal/terminal-view/$TERMINAL_LIB_VERSION/terminal-view-$TERMINAL_LIB_VERSION.pom"
          curl --max-time 600 --no-progress-meter "https://jitpack.io/com/github/ESTRIN217/Terminal/termux-shared/$TERMINAL_LIB_VERSION/termux-shared-$TERMINAL_LIB_VERSION.pom"
