# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
compileSdkVersion=37
# AGP's aapt2 "optimize" pass (OptimizeResourcesTask) silently produces nothing on this
# project: it scans its input directory for a file ending in .ap_/.apk, finds none, and
# reports BUILD SUCCESSFUL without writing the artifact. The optimized .ap_ carries the
# compiled AndroidManifest.xml, so without it the release APK is packaged with no manifest,
# no resources.arsc and no res/ at all — unusable. Disable it until it works.
android.enableResourceOptimizations=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
minSdkVersion=24
ndkVersion=30.0.14904198
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=682m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
targetSdkVersion=28
